# Render Web Service — admin + API (keep public site on Static Site)
# https://render.com/docs/blueprint-spec
#
# Split setup:
#   • Static Site (render.yaml) — public website, fast CDN
#   • This Web Service — /admin login, /api/trpc, optional card uploads
#
# After deploy, copy this service URL and set on the Static Site:
#   VITE_ADMIN_URL=https://<this-service>.onrender.com/admin
# Then redeploy the Static Site.
#
# Deploy:
#   1. Render Dashboard → New → Web Service
#   2. Same repo, branch main
#   3. Set ADMIN_PASSWORD (at least 8 characters)

services:
  - type: web
    name: shop-lake-norman-admin
    runtime: node
    region: ohio
    branch: main
    plan: free
    buildCommand: pnpm install && pnpm build
    preDeployCommand: bash scripts/render-predeploy.sh
    startCommand: pnpm start
    healthCheckPath: /admin
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
