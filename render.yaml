# Render Blueprint for Shop Lake Norman / LKNSBN
# https://render.com/docs/blueprint-spec
#
# Deploy:
#   1. Render Dashboard → New → Blueprint
#   2. Connect github.com/shamsdigital/shop-lake-norman-lkn
#   3. When prompted, set ADMIN_PASSWORD (8 digits, e.g. 48291730)
#   4. Optional: DATABASE_URL + Forge storage keys for /admin card uploads

services:
  - type: web
    name: shop-lake-norman-lkn
    runtime: node
    region: ohio
    branch: main
    buildCommand: corepack enable && pnpm install && pnpm build
    preDeployCommand: bash scripts/render-predeploy.sh
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
