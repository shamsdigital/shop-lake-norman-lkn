# Render Static Site — Shop Lake Norman / LKNSBN
# https://render.com/docs/blueprint-spec
#
# IMPORTANT: Publish Directory must be dist/public (not dist)
#
# Deploy:
#   1. Render Dashboard → New → Static Site (or Blueprint)
#   2. Connect github.com/shamsdigital/shop-lake-norman-lkn
#   3. Branch: main
#   4. Publish Directory: dist/public

services:
  - type: web
    name: shop-lake-norman-lkn
    runtime: static
    branch: main
    buildCommand: pnpm install && pnpm build:static
    staticPublishPath: dist/public
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
