# Render Static Site — public website (no backend)
# https://render.com/docs/blueprint-spec
#
# Split setup with render-web.yaml:
#   • This Static Site — public pages (/, /about, /stories, etc.)
#   • Web Service shop-lake-norman-admin — /admin + API
#
# After the Web Service is live, set:
#   VITE_ADMIN_URL=https://shop-lake-norman-admin.onrender.com/admin
# (use your actual Web Service URL) and redeploy this Static Site.
#
# Publish Directory must be dist/public (not dist)

services:
  - type: web
    name: shop-lake-norman-lkn
    runtime: static
    branch: main
    buildCommand: pnpm install && pnpm build:static
    staticPublishPath: dist/public
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_ADMIN_URL
        sync: false
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
